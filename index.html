<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Medical Mall — A hospital-backed recovery platform</title>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.cdnfonts.com/css/clear-sans" rel="stylesheet"/>
<link rel="stylesheet" href="Satoshi_Complete/Fonts/WEB/css/satoshi.css"/>
<link rel="stylesheet" href="styles.css"/>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@0.474.0/dist/umd/lucide.min.js"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="homepage.jsx"></script>
<script type="text/babel" src="homepage-v2.jsx"></script>
<script type="text/babel" src="oncology-v2.jsx"></script>
<script type="text/babel" src="oncology-plp-v2.jsx"></script>
<script type="text/babel" src="wigs-v2.jsx"></script>
<script type="text/babel" src="pdp.jsx"></script>
<script type="text/babel" src="pdp-v2.jsx"></script>
<script type="text/babel" src="ar-kiosk.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const App = () => {
  const [page, setPage] = useState("home-v2");
  const [chatOpen, setChatOpen] = useState(false);
  const navigate = (p) => { setPage(p); window.scrollTo({ top: 0, behavior: "instant" }); };

  /* Kiosk is fully standalone — no Header/Footer */
  if (page === "ar-kiosk") {
    return (
      <>
        <ARKioskApp />
        <div style={{
          position: "fixed", bottom: 28, left: 28, zIndex: 9999,
          background: "rgba(20,32,27,.92)", color: "#F4EFE6",
          borderRadius: 999, padding: 5,
          display: "flex", gap: 4,
          boxShadow: "0 14px 30px -10px rgba(20,32,27,.5)",
          backdropFilter: "blur(10px)",
          fontSize: 12,
        }}>
          <button onClick={() => navigate("home-v2")} style={{
            padding: "8px 14px", borderRadius: 999,
            background: "transparent", color: "#F4EFE6",
            fontFamily: "var(--mono)", letterSpacing: ".05em", textTransform: "uppercase",
          }}>← Back to Site</button>
          <button style={{
            padding: "8px 14px", borderRadius: 999,
            background: "#E2C896", color: "var(--green-900)",
            fontWeight: 500,
            fontFamily: "var(--mono)", letterSpacing: ".05em", textTransform: "uppercase",
          }}>AR Kiosk</button>
        </div>
      </>
    );
  }

  return (
    <>
      <Header navigate={navigate} current={page} forceGlass={page === "wigs-v2" || page === "pdp-v2"}/>
      <div>
        {page === "home-v2"        && <HomepageV2 navigate={navigate}/>}
        {page === "oncology-v2"    && <OncologyV2 navigate={navigate}/>}
        {page === "oncology-plp-v2"&& <OncologyPLPV2 navigate={navigate}/>}
        {page === "wigs-v2"        && <WigsV2 navigate={navigate}/>}
        {page === "pdp-v2"         && <PDPV2 navigate={navigate}/>}
      </div>
      <Footer lightBg={page === "oncology-v2" || page === "wigs-v2"}/>
      {/* mini nav helper */}
      <div style={{
        position: "fixed", bottom: 28, left: 28, zIndex: 70,
        background: "rgba(20,32,27,.92)", color: "#F4EFE6",
        borderRadius: 999, padding: 5,
        display: "flex", gap: 4,
        boxShadow: "0 14px 30px -10px rgba(20,32,27,.5)",
        backdropFilter: "blur(10px)",
        fontSize: 12,
      }}>
        {[
          { k: "home-v2",         l: "Home" },
          { k: "oncology-v2",     l: "Oncology" },
          { k: "oncology-plp-v2", l: "PLP" },
          { k: "wigs-v2",         l: "Wigs" },
          { k: "pdp-v2",          l: "Wig PDP" },
          { k: "ar-kiosk",        l: "AR Kiosk" },
        ].map(p => (
          <button key={p.k} onClick={() => navigate(p.k)} style={{
            padding: "8px 14px", borderRadius: 999,
            background: page === p.k ? "#E2C896" : "transparent",
            color: page === p.k ? "var(--green-900)" : "#F4EFE6",
            fontWeight: page === p.k ? 500 : 400,
            fontFamily: "var(--mono)", letterSpacing: ".05em", textTransform: "uppercase",
          }}>{p.l}</button>
        ))}
      </div>
    </>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
